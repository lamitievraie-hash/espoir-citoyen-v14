<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ESPOIR CITOYEN V14</title>
  <style>
    body { font-family: Arial; max-width: 1100px; margin: 20px auto; padding: 20px; background: #f5f5f5; }
    h1 { color: #003366; text-align: center; }
   .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
   .stat-box { background: #003366; color: white; padding: 20px; border-radius: 8px; text-align: center; }
   .stat-box h3 { margin: 0; font-size: 14px; opacity: 0.8; }
   .stat-box p { margin: 10px 0 0; font-size: 28px; font-weight: bold; }
   .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #003366; }
   .tab { padding: 10px 20px; cursor: pointer; background: #eee; border: none; font-size: 16px; }
   .tab.active { background: #003366; color: white; }
   .content { display: none; background: white; padding: 20px; border-radius: 8px; }
   .content.active { display: block; }
    input, select, button { padding: 10px; margin: 5px; font-size: 16px; border-radius: 4px; border: 1px solid #ccc; }
    button { background: #003366; color: white; border: none; cursor: pointer; }
   .btn-export { background: #059669; width: auto; margin-bottom: 15px; }
   .btn-edit { background: #F59E0B; }
   .btn-delete { background: #EF4444; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    td, th { border: 1px solid #ddd; padding: 12px; text-align: left; }
    th { background: #003366; color: white; }
   .form-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
   .actions { display: flex; gap: 5px; }
   .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
   .modal-content { background: white; margin: 10% auto; padding: 20px; width: 400px; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>🇨🇮 ESPOIR CITOYEN V14</h1>

  <!-- STATS -->
  <div class="stats">
    <div class="stat-box">
      <h3>TOTAL MEMBRES</h3>
      <p id="totalMembres">0</p>
    </div>
    <div class="stat-box">
      <h3>TOTAL COTISATIONS</h3>
      <p id="totalCotisations">0 FCFA</p>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="openTab('membres')">Membres</button>
    <button class="tab" onclick="openTab('cotisations')">Cotisations</button>
  </div>

  <!-- ONGLET MEMBRES -->
  <div id="membres" class="content active">
    <h2>Ajouter un membre</h2>
    <div class="form-row">
      <input id="nom" placeholder="Nom complet">
      <input id="telephone" placeholder="Téléphone">
      <input id="quartier" placeholder="Quartier">
      <button onclick="ajouterMembre()">Ajouter</button>
    </div>

    <button class="btn-export" onclick="exporterMembres()">📊 Exporter Excel</button>

    <h3>Liste des membres</h3>
    <table>
      <thead>
        <tr><th>Nom</th><th>Téléphone</th><th>Quartier</th><th>Date</th><th>Actions</th></tr>
      </thead>
      <tbody id="listeMembres"></tbody>
    </table>
  </div>

  <!-- ONGLET COTISATIONS -->
  <div id="cotisations" class="content">
    <h2>Enregistrer une cotisation</h2>
    <div class="form-row">
      <select id="membre_id"><option value="">Choisir un membre</option></select>
      <input id="montant" type="number" placeholder="Montant FCFA">
      <button onclick="ajouterCotisation()">Enregistrer</button>
    </div>

    <h3>Historique des cotisations</h3>
    <table>
      <thead>
        <tr><th>Membre</th><th>Montant</th><th>Date</th><th>Action</th></tr>
      </thead>
      <tbody id="listeCotisations"></tbody>
    </table>
  </div>

  <!-- MODAL MODIFIER MEMBRE -->
  <div id="modalEdit" class="modal">
    <div class="modal-content">
      <h3>Modifier le membre</h3>
      <input type="hidden" id="edit_id">
      <input id="edit_nom" placeholder="Nom complet" style="width: 95%;"><br>
      <input id="edit_telephone" placeholder="Téléphone" style="width: 95%;"><br>
      <input id="edit_quartier" placeholder="Quartier" style="width: 95%;"><br><br>
      <button onclick="validerModification()">Enregistrer</button>
      <button onclick="fermerModal()" style="background: #6B7280;">Annuler</button>
    </div>
  </div>

  <script>
    let membreEnCours = null;

    function openTab(tabName) {
      document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById(tabName).classList.add('active');
      event.target.classList.add('active');
      if(tabName === 'cotisations') chargerCotisations();
    }

    // ===== STATS =====
    async function chargerStats() {
      const res = await fetch('/api/stats');
      const data = await res.json();
      document.getElementById('totalMembres').textContent = data.total_membres;
      document.getElementById('totalCotisations').textContent = data.total_cotisations.toLocaleString() + ' FCFA';
    }

    // ===== MEMBRES =====
    async function chargerMembres() {
      const res = await fetch('/api/membres');
      const data = await res.json();
      document.getElementById('listeMembres').innerHTML = data.map(m => `
        <tr>
          <td>${m.nom}</td>
          <td>${m.telephone}</td>
          <td>${m.quartier}</td>
          <td>${new Date(m.date_inscription).toLocaleDateString('fr-FR')}</td>
          <td class="actions">
            <button class="btn-edit" onclick='ouvrirModal(${JSON.stringify(m)})'>✏️</button>
            <button class="btn-delete" onclick="supprimerMembre(${m.id})">🗑️</button>
          </td>
        </tr>
      `).join('');
      chargerSelectMembres();
      chargerStats();
    }

    async function ajouterMembre() {
      const nom = document.getElementById('nom').value;
      const telephone = document.getElementById('telephone').value;
      const quartier = document.getElementById('quartier').value;
      if (!nom) return alert('Nom obligatoire');
      await fetch('/api/membres', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nom, telephone, quartier })
      });
      document.getElementById('nom').value = '';
      document.getElementById('telephone').value = '';
      document.getElementById('quartier').value = '';
      chargerMembres();
    }

    function ouvrirModal(membre) {
      document.getElementById('edit_id').value = membre.id;
      document.getElementById('edit_nom').value = membre.nom;
      document.getElementById('edit_telephone').value = membre.telephone;
      document.getElementById('edit_quartier').value = membre.quartier;
      document.getElementById('modalEdit').style.display = 'block';
    }

    function fermerModal() {
      document.getElementById('modalEdit').style.display = 'none';
    }

    async function validerModification() {
      const id = document.getElementById('edit_id').value;
      const nom = document.getElementById('edit_nom').value;
      const telephone = document.getElementById('edit_telephone').value;
      const quartier = document.getElementById('edit_quartier').value;
      await fetch(`/api/membres/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nom, telephone, quartier })
      });
      fermerModal();
      chargerMembres();
    }

    async function supprimerMembre(id) {
      if (confirm('Supprimer ce membre?')) {
        await fetch(`/api/membres/${id}`, { method: 'DELETE' });
        chargerMembres();
      }
    }

    function exporterMembres() {
      window.location.href = '/api/export/membres';
    }

    // ===== COTISATIONS =====
    async function chargerSelectMembres() {
      const res = await fetch('/api/membres');
      const data = await res.json();
      document.getElementById('membre_id').innerHTML = '<option value="">Choisir un membre</option>' +
        data.map(m => `<option value="${m.id}">${m.nom}</option>`).join('');
    }

    async function chargerCotisations() {
      const res = await fetch('/api/cotisations');
      const data = await res.json();
      document.getElementById('listeCotisations').innerHTML = data.map(c => `
        <tr>
          <td>${c.nom}</td>
          <td>${c.montant.toLocaleString()} FCFA</td>
          <td>${new Date(c.date_cotisation).toLocaleDateString('fr-FR')}</td>
          <td><button class="btn-delete" onclick="supprimerCotisation(${c.id})">🗑️</button></td>
        </tr>
      `).join('');
      chargerStats();
    }

    async function ajouterCotisation() {
      const membre_id = document.getElementById('membre_id').value;
      const montant = document.getElementById('montant').value;
      if (!membre_id ||!montant) return alert('Choisis un membre et un montant');
      await fetch('/api/cotisations', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ membre_id, montant })
      });
      document.getElementById('montant').value = '';
      chargerCotisations();
    }

    async function supprimerCotisation(id) {
      if (confirm('Supprimer cette cotisation?')) {
        await fetch(`/api/cotisations/${id}`, { method: 'DELETE' });
        chargerCotisations();
      }
    }

    // DÉMARRAGE
    chargerMembres();
  </script>
</body>
</html>
