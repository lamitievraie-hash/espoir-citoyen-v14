<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ESPOIR CITOYEN V14</title>
  <style>
    body { font-family: Arial; max-width: 900px; margin: 20px auto; padding: 20px; }
    h1 { color: #003366; text-align: center; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #003366; }
    .tab { padding: 10px 20px; cursor: pointer; background: #eee; border: none; }
    .tab.active { background: #003366; color: white; }
    .content { display: none; }
    .content.active { display: block; }
    input, button { padding: 10px; margin: 5px; font-size: 16px; }
    button { background: #003366; color: white; border: none; cursor: pointer; border-radius: 4px; }
    .btn-export { background: #059669; width: auto; margin-bottom: 15px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    td, th { border: 1px solid #ddd; padding: 12px; text-align: left; }
    th { background: #003366; color: white; }
    .form-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
  </style>
</head>
<body>
  <h1>🇨🇮 ESPOIR CITOYEN V14</h1>

  <div class="tabs">
    <button class="tab active" onclick="openTab('membres')">Membres</button>
    <button class="tab" onclick="openTab('cotisations')">Cotisations</button>
  </div>

  <div id="membres" class="content active">
    <h2>Ajouter un membre</h2>
    <div class="form-row">
      <input id="nom" placeholder="Nom complet">
      <input id="telephone" placeholder="Téléphone">
      <input id="quartier" placeholder="Quartier">
      <button onclick="ajouterMembre()">Ajouter</button>
    </div>

    <button class="btn-export" onclick="exporterMembres()">📊 Exporter Excel</button>

    <h3>Liste des membres</h3>
    <table>
      <thead>
        <tr>
          <th>Nom</th>
          <th>Téléphone</th>
          <th>Quartier</th>
          <th>Date</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="listeMembres"></tbody>
    </table>
  </div>

  <div id="cotisations" class="content">
    <h2>Cotisations - À venir</h2>
  </div>

  <script>
    function openTab(tabName) {
      document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById(tabName).classList.add('active');
      event.target.classList.add('active');
    }

    async function chargerMembres() {
      const res = await fetch('/api/membres');
      const data = await res.json();
      document.getElementById('listeMembres').innerHTML = data.map(m => `
        <tr>
          <td>${m.nom}</td>
          <td>${m.telephone}</td>
          <td>${m.quartier}</td>
          <td>${new Date(m.date_inscription).toLocaleDateString('fr-FR')}</td>
          <td>
            <button onclick="supprimerMembre(${m.id})" style="background:#EF4444; color:white; border:none; padding:5px 10px; border-radius:4px;">
              🗑️
            </button>
          </td>
        </tr>
      `).join('');
    }

    async function ajouterMembre() {
      const nom = document.getElementById('nom').value;
      const telephone = document.getElementById('telephone').value;
      const quartier = document.getElementById('quartier').value;
      if (!nom) return alert('Nom obligatoire');
      await fetch('/api/membres', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nom, telephone, quartier })
      });
      document.getElementById('nom').value = '';
      document.getElementById('telephone').value = '';
      document.getElementById('quartier').value = '';
      chargerMembres();
    }

    async function supprimerMembre(id) {
      if (confirm('Supprimer ce membre ?')) {
        await fetch(`/api/membres/${id}`, { method: 'DELETE' });
        chargerMembres();
      }
    }

    function exporterMembres() {
      window.location.href = '/api/export/membres';
    }

    // CHARGEMENT AU DÉMARRAGE - C'EST ÇA QUI MANQUE CHEZ TOI
    chargerMembres();
  </script>
</body>
</html>
