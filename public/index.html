<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONG - V16 BADGE PRO</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@keyframes pulse-boss { 0%,100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239,68,68,0.7); } 50% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(239,68,68,0); } }
.badge-pulse { animation: pulse-boss 1.5s infinite; }
</style>
</head>
<body class="bg-gray-100 min-h-screen pb-24">

<!-- HEADER V16 PRO -->
<div class="bg-[#002244] text-white p-4 sticky top-0 z-50 shadow-xl">
  <div class="flex justify-between items-center">
    <div>
      <h1 class="font-black text- leading-none">🇨🇮 ESPOIR CITOYEN V16</h1>
      <p class="text- opacity-60 mt-1 tracking-widest">BADGE PRO EDITION</p>
    </div>
    <div id="status" class="px-3 py-1 rounded-full text- font-black">🟢 EN LIGNE</div>
  </div>

  <!-- LES 2 BADGES BOSS -->
  <div class="mt-4 grid grid-cols-2 gap-3">
    <div class="bg-white/10 backdrop-blur p-3 rounded-2xl border border-white/20">
      <p class="text- opacity-70">CAISSE TOTALE</p>
      <p id="totalCaisse" class="text-lg font-black">129 000 FCFA</p>
    </div>
    <div id="cardAttente" class="bg-[#FF3B30] p-3 rounded-2xl border border-white/20 transition-all">
      <div class="flex justify-between items-center">
        <p class="text- opacity-90">EN ATTENTE SYNC</p>
        <span id="dot" class="w-2 h-2 bg-white rounded-full"></span>
      </div>
      <p id="badgeAttente" class="text-lg font-black">0</p>
      <p id="subAttente" class="text-">Aucune attente</p>
    </div>
  </div>
</div>

<div class="p-4 space-y-4">

  <!-- ENCAISSEMENT -->
  <div class="bg-white rounded- p-4 shadow-sm border">
    <h2 class="font-black text-sm mb-3">⚡ ENCAISSEMENT TERRAIN</h2>
    <div class="flex gap-2">
      <select id="membreSelect" class="flex-1 p-3 bg-gray-100 border-0 rounded-xl font-bold text-sm"></select>
      <select id="montantSelect" class="p-3 bg-gray-100 border-0 rounded-xl font-bold text-sm">
        <option value="1000">1000F</option><option value="2000">2000F</option><option value="5000">5000F</option><option value="10000">10000F</option>
      </select>
    </div>
    <button onclick="encaisser()" class="w-full mt-3 bg-[#FF9A00] text-white py-4 rounded-xl font-black text-sm tracking-widest active:scale-[0.98]">💥 ENCAISSER MAINTENANT</button>
    <p class="text- text-center text-gray-400 mt-2">📴 Fonctionne sans 4G - Sauvegarde auto</p>
  </div>

  <!-- LISTE D'ATTENTE DETAILLÉE (NOUVEAU V16) -->
  <div id="zoneAttente" class="hidden bg-orange-50 border-2 border-dashed border-orange-300 rounded- p-4">
    <div class="flex justify-between items-center mb-3">
      <h3 class="font-black text-sm text-orange-600">⏳ FILE D'ATTENTE (<span id="countDetail">0</span>)</h3>
      <button onclick="forcerSync()" class="bg-orange-500 text-white px-3 py-1 rounded-full text-xs font-bold">FORCER SYNC</button>
    </div>
    <div id="listeAttente" class="space-y-2 max-h-60 overflow-auto"></div>
  </div>

  <!-- MEMBRES -->
  <div class="bg-white rounded- shadow-sm border overflow-hidden">
    <div class="p-4 flex justify-between items-center border-b bg-gray-50">
      <span class="font-black text-sm">👥 14 MEMBRES OFFLINE</span>
      <span class="text- bg-black text-white px-2 py-1 rounded-full">DISPO OFFLINE</span>
    </div>
    <div id="listeMembres" class="divide-y"></div>
  </div>
</div>

<!-- BOUTON FLOTTANT BADGE (QUAND EN ATTENTE) -->
<div id="fabBadge" class="hidden fixed bottom-6 right-6 z-50">
  <button onclick="document.getElementById('zoneAttente').scrollIntoView({behavior:'smooth'})" class="badge-pulse bg-red-600 text-white w-16 h-16 rounded-full shadow-2xl flex flex-col items-center justify-center font-black">
    <span id="fabCount" class="text-xl leading-none">0</span>
    <span class="text-">ATTENTE</span>
  </button>
</div>

<script>
const MEMBRES_BASE = [
  {id:1, nom:"Kouamé Adjoua - Abobo", cotise:12000, tel:"07 01 02 03 04"},
  {id:2, nom:"Yao Cédric - Yopougon", cotise:10000, tel:"07 11 22 33 44"},
  {id:3, nom:"Bamba Fatou - Port-Bouët", cotise:15000, tel:"05 44 55 66 77"},
  {id:4, nom:"Koné Mamadou - Abobo", cotise:8000, tel:"07 99 88 77 66"},
  {id:5, nom:"Traoré Awa - Yopougon", cotise:9000, tel:"01 02 03 04 05"},
  {id:6, nom:"Diallo Isma - Adjamé", cotise:11000, tel:"07 00 11 22 33"},
  {id:7, nom:"Koffi Serge - Cocody", cotise:7000, tel:"05 01 02 03 04"},
  {id:8, nom:"N'Guessan Grace - Abobo", cotise:13000, tel:"07 10 20 30 40"},
  {id:9, nom:"Soro Karim - Yopougon", cotise:5000, tel:"01 11 22 33 44"},
  {id:10, nom:"Fofana Lina - Treichville", cotise:10000, tel:"07 22 33 44 55"},
  {id:11, nom:"Ouattara Jean - Port-Bouët", cotise:8000, tel:"05 55 66 77 88"},
  {id:12, nom:"Ehui Paul - Yopougon", cotise:12000, tel:"07 33 44 55 66"},
  {id:13, nom:"Amani Colette - Abobo", cotise:6000, tel:"01 99 88 77 66"},
  {id:14, nom:"Kouassi Franck - Marcory", cotise:9000, tel:"07 45 46 47 48"},
];

let cotisationsLocales = JSON.parse(localStorage.getItem('cotisations_offline_v16') || '[]');
let attenteSync = JSON.parse(localStorage.getItem('attente_sync_v16') || '[]');

function init(){
  document.getElementById('membreSelect').innerHTML = MEMBRES_BASE.map(m=>`<option value="${m.id}">${m.nom}</option>`).join('');
  afficher();
  setInterval(updateUI, 1000);
}

function afficher(){
  const totalLocal = cotisationsLocales.reduce((a,b)=>a+b.montant,0);
  document.getElementById('totalCaisse').innerText = (129000 + totalLocal).toLocaleString() + ' FCFA';

  document.getElementById('listeMembres').innerHTML = MEMBRES_BASE.map(m=>{
    const payeLocal = cotisationsLocales.filter(c=>c.membreId==m.id).reduce((a,b)=>a+b.montant,0);
    return `<div class="p-4 flex justify-between items-center">
      <div><p class="font-bold text-sm">${m.nom}</p><p class="text- text-gray-500">${(m.cotise+payeLocal).toLocaleString()}F ${payeLocal>0?`<span class="bg-orange-100 text-orange-600 px-1 rounded font-bold">+${payeLocal} OFFLINE</span>`:''}</p></div>
      <div class="w-2 h-2 ${payeLocal>0?'bg-orange-500':'bg-green-500'} rounded-full"></div>
    </div>`
  }).join('');

  // Liste d'attente détaillée
  document.getElementById('countDetail').innerText = attenteSync.length;
  document.getElementById('listeAttente').innerHTML = attenteSync.map((c,i)=>{
    const membre = MEMBRES_BASE.find(x=>x.id==c.membreId);
    return `<div class="bg-white p-3 rounded-xl flex justify-between items-center text-xs border">
      <div><p class="font-bold">${membre?membre.nom:'Membre '+c.membreId}</p><p class="text-gray-400">${new Date(c.date).toLocaleTimeString()} • ${c.montant}F</p></div>
      <span class="w-6 h-6 bg-orange-100 rounded-full flex items-center justify-center">⏳</span>
    </div>`
  }).join('') || '<p class="text-xs text-center text-gray-400 py-4">Aucune cotisation en attente</p>';
}

function encaisser(){
  const id = parseInt(document.getElementById('membreSelect').value);
  const montant = parseInt(document.getElementById('montantSelect').value);
  const data = {membreId:id, montant, date:new Date().toISOString(), uid:Date.now()};
  cotisationsLocales.push(data);
  attenteSync.push(data);
  localStorage.setItem('cotisations_offline_v16', JSON.stringify(cotisationsLocales));
  localStorage.setItem('attente_sync_v16', JSON.stringify(attenteSync));
  if(navigator.vibrate) navigator.vibrate([100,50,100]);
  afficher(); updateUI();
}

function updateUI(){
  const online = navigator.onLine;
  const status = document.getElementById('status');
  status.innerText = online? '🟢 EN LIGNE' : '🔴 HORS LIGNE';
  status.className = `px-3 py-1 rounded-full text- font-black ${online?'bg-green-400 text-green-900':'bg-red-400 text-red-900'}`;

  const card = document.getElementById('cardAttente');
  const badge = document.getElementById('badgeAttente');
  const sub = document.getElementById('subAttente');
  const fab = document.getElementById('fabBadge');
  const zone = document.getElementById('zoneAttente');
  const count = attenteSync.length;

  if(count>0){
    card.className = "bg-[#FF3B30] p-3 rounded-2xl border border-white/20 badge-pulse";
    badge.innerText = count + (count==1?' EN ATTENTE':' EN ATTENTE');
    sub.innerText = 'Clique pour voir la liste';
    fab.classList.remove('hidden');
    zone.classList.remove('hidden');
    document.getElementById('fabCount').innerText = count;
  } else {
    card.className = "bg-green-500 p-3 rounded-2xl border border-white/20";
    badge.innerText = '✅ SYNC OK';
    sub.innerText = online?'Tout est synchronisé':'Prêt pour offline';
    fab.classList.add('hidden');
    zone.classList.add('hidden');
  }

  // SYNC AUTO
  if(online && count>0 &&!window.syncing){
    window.syncing = true;
    setTimeout(()=>{
      // ICI TON CODE SUPABASE : await supabase.from('cotisations').insert(attenteSync)
      attenteSync = [];
      localStorage.setItem('attente_sync_v16', JSON.stringify(attenteSync));
      window.syncing = false;
      afficher(); updateUI();
      // NOTIF BOSS
      const notif = document.createElement('div');
      notif.className = 'fixed top-20 left-1/2 -translate-x-1/2 bg-black text-white px-4 py-2 rounded-full text-xs font-bold z-50';
      notif.innerText = '✅ '+count+' cotisations synchronisées!';
      document.body.appendChild(notif);
      setTimeout(()=>notif.remove(), 3000);
    }, 2000);
  }
}

function forcerSync(){
  if(!navigator.onLine) return alert('📴 Pas de réseau pour sync. Va vers un endroit avec 4G.');
  updateUI();
}

window.addEventListener('online', updateUI);
window.addEventListener('offline', updateUI);
init();
</script>
</body>
</html>
