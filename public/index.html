<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V16.5 PHOTO OFFLINE</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>.carte-membre{width:340px;height:214px;border:3px solid #002244;border-radius:12px;padding:15px;background:white;position:relative}.carte-photo{width:70px;height:70px;border-radius:50%;object-fit:cover;position:absolute;top:15px;right:15px;border:2px solid #002244}.carte-qr{width:60px;position:absolute;bottom:10px;right:10px}.photo-rond{width:40px;height:40px;border-radius:50%;object-fit:cover}</style>
</head>
<body class="bg-[#f1f5f9]">
<div class="bg-[#002244] text-white p-4 sticky top-0 z-50">
  <div class="flex justify-between items-center"><h1 class="font-black">🇨🇮 V16.5 PHOTO OFFLINE <span id="statusReseau" class="ml-2"></span><span id="badgeAttente"></span></h1><div class="flex gap-2"><button onclick="reveillerServeur()" class="bg-yellow-400 text-black px-3 py-1 rounded-full text-xs font-black">🔌 REVEILLER SERVEUR</button><button onclick="viderCache()" class="bg-red-500 px-3 py-1 rounded-full text-xs">Vider</button></div></div>
  <div class="mt-4 grid grid-cols-2 lg:grid-cols-4 gap-3">
    <div class="bg-white/10 p-3 rounded-2xl"><p class="text- opacity-60">TOTAL MEMBRES</p><p id="totalMembres" class="text-xl font-black">0</p></div>
    <div class="bg-white/10 p-3 rounded-2xl"><p class="text- opacity-60">TOTAL COTISATIONS</p><p id="totalCotisations" class="text-xl font-black">0</p></div>
    <div class="bg-white/10 p-3 rounded-2xl"><p class="text- opacity-60">QUARTIERS</p><p id="totalQuartiers" class="text-xl font-black">0</p></div>
    <div id="cardAttentePro" class="bg-green-500 p-3 rounded-2xl"><p id="textAttentePro" class="text-sm font-black">✅ SYNC OK</p><p id="subServeur" class="text-"></p></div>
  </div>
</div>
<div class="max-w- mx-auto p-4 space-y-4">
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-4"><div class="bg-white p-4 rounded-2xl shadow-sm"><canvas id="chartQuartier"></canvas></div><div class="bg-white p-4 rounded-2xl shadow-sm"><canvas id="chartMois"></canvas></div></div>
  <div class="flex gap-2"><button class="px-5 py-3 rounded-xl bg-[#002244] text-white font-bold text-sm" onclick="openTab('membres')">👥 Membres</button><button class="px-5 py-3 rounded-xl bg-white font-bold text-sm" onclick="openTab('cotisations')">💰 Cotisations</button><button class="px-5 py-3 rounded-xl bg-[#FF9A00] text-white font-black text-sm" onclick="openTab('terrain')">⚡ TERRAIN</button></div>

  <div id="membres" class="bg-white p-4 rounded-2xl shadow-sm">
    <form id="formMembre" class="flex gap-2 flex-wrap mb-4 bg-yellow-50 p-3 rounded-xl border-2 border-yellow-200">
      <input id="nom" placeholder="Nom complet *" required class="p-3 border-2 rounded-xl flex-1 font-bold">
      <input id="telephone" placeholder="WhatsApp" class="p-2 border rounded-lg">
      <input id="quartier" placeholder="Quartier" class="p-2 border rounded-lg">
      <div class="flex items-center gap-2 bg-white p-2 rounded-lg border"><input type="file" id="photo" accept="image/*" class="text-xs"><img id="previewForm" class="w-10 h-10 rounded-full hidden object-cover"></div>
      <button type="submit" class="bg-[#002244] text-white px-6 py-3 rounded-xl font-black">+ AJOUTER</button>
    </form>
    <input id="search" placeholder="🔍 Rechercher..." onkeyup="rechercherMembres()" class="p-2 border rounded-lg w-full max-w-xs mb-3">
    <div class="overflow-auto"><table class="w-full text-sm"><thead><tr class="bg-[#002244] text-white"><th class="p-3">Photo</th><th>Nom</th><th>Tél</th><th>Quartier</th><th>Date</th><th class="p-3 w-">Actions</th></tr></thead><tbody id="listeMembres"></tbody></table></div>
  </div>

  <div id="cotisations" class="hidden bg-white p-4 rounded-2xl shadow-sm">
    <div class="flex gap-2 flex-wrap mb-4 bg-gray-50 p-3 rounded-xl"><select id="membre_id" class="p-3 border rounded-xl flex-1 font-bold"><option value="">-- Choisir --</option></select><input id="montant" type="number" placeholder="Montant" class="p-3 border-2 border-green-500 rounded-xl font-bold"><button onclick="ajouterCotisation()" class="bg-green-600 text-white px-6 py-3 rounded-xl font-black">💰 ENREGISTRER</button></div>
    <div class="overflow-auto"><table class="w-full text-sm"><thead><tr class="bg-[#002244] text-white"><th>Membre</th><th>Quartier</th><th>Montant</th><th>Date</th><th>Actions</th></tr></thead><tbody id="listeCotisations"></tbody></table></div>
  </div>

  <div id="terrain" class="hidden bg-white p-4 rounded-2xl border-2 border-orange-400"><div id="listeTerrain" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div></div>
  <div id="zoneAttente" class="hidden bg-red-50 border-2 border-dashed border-red-300 rounded-2xl p-4"><h3 class="font-black text-red-600">⏳ EN ATTENTE: <span id="countDetail">0</span> <button onclick="syncDonneesOffline()" class="ml-3 bg-red-600 text-white px-3 py-1 rounded-full text-xs">FORCER SYNC</button></h3><div id="listeAttente" class="mt-3 space-y-2 text-xs"></div><p class="text- mt-2 text-gray-500">Le serveur Render dort. Clique sur REVEILLER SERVEUR puis FORCER SYNC.</p></div>
</div>

<div id="modalEdit" class="hidden fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4"><div class="bg-white w-full max-w-md p-6 rounded-2xl"><h3 class="font-black mb-3">✏️ Modifier</h3><form id="formEditMembre"><input type="hidden" id="edit_id"><img id="previewEdit" class="w-20 h-20 rounded-full mx-auto mb-3 object-cover hidden"><input id="edit_nom" class="w-full p-3 border rounded-xl mb-2 font-bold"><input id="edit_telephone" class="w-full p-2 border rounded-lg mb-2"><input id="edit_quartier" class="w-full p-2 border rounded-lg mb-2"><input type="file" id="edit_photo" class="w-full mb-3"><div class="flex gap-2"><button type="submit" class="flex-1 bg-[#002244] text-white py-3 rounded-xl font-black">Enregistrer</button><button type="button" onclick="fermerModal('modalEdit')" class="flex-1 bg-gray-300 py-3 rounded-xl">Annuler</button></div></form></div></div>
<div id="modalCarte" class="hidden fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4"><div class="bg-white p-6 rounded-2xl text-center"><div id="carteMembre" class="carte-membre mx-auto text-left"></div><div class="flex gap-2 mt-4"><button onclick="window.print()" class="flex-1 bg-blue-600 text-white py-2 rounded-xl">🖨 Imprimer</button><button onclick="fermerModal('modalCarte')" class="flex-1 bg-gray-400 text-white py-2 rounded-xl">Fermer</button></div></div></div>

<script>
let chartQuartier=null, chartMois=null, db, cacheMembresGlobal=[], cacheCotisGlobal=[], tempPhotoBase64='', tempEditPhotoBase64='';
const initDB=()=>new Promise((res)=>{const r=indexedDB.open('espoir-citoyen-offline',4);r.onupgradeneeded=e=>{db=e.target.result;if(!db.objectStoreNames.contains('membres_offline'))db.createObjectStore('membres_offline',{keyPath:'tempId',autoIncrement:true});if(!db.objectStoreNames.contains('cotisations_offline'))db.createObjectStore('cotisations_offline',{keyPath:'tempId',autoIncrement:true});if(!db.objectStoreNames.contains('cache_membres'))db.createObjectStore('cache_membres',{keyPath:'id'});if(!db.objectStoreNames.contains('cache_cotisations'))db.createObjectStore('cache_cotisations',{keyPath:'id'})};r.onsuccess=e=>{db=e.target.result;res(db)}});
function isOnline(){return navigator.onLine}
function updateStatusReseau(){document.getElementById('statusReseau').innerHTML=isOnline()?'<span class="bg-green-400 text-green-900 px-2 py-1 rounded-full text- font-black">🟢 EN LIGNE</span>':'<span class="bg-red-400 text-white px-2 py-1 rounded-full text-">🔴 OFFLINE</span>';updateBadgeAttente()}
window.addEventListener('online',()=>{updateStatusReseau();syncDonneesOffline()});window.addEventListener('offline',updateStatusReseau);
async function updateBadgeAttente(){if(!db)return;const txM=db.transaction('membres_offline','readonly');const mOff=await new Promise(r=>{const q=txM.objectStore('membres_offline').getAll();q.onsuccess=()=>r(q.result)});const txC=db.transaction('cotisations_offline','readonly');const cOff=await new Promise(r=>{const q=txC.objectStore('cotisations_offline').getAll();q.onsuccess=()=>r(q.result)});const total=mOff.length+cOff.length;document.getElementById('badgeAttente').innerHTML=total>0?`<span class="bg-red-600 text-white px-2 py-1 rounded-full text- font-black ml-2">🔴 ${total} EN ATTENTE</span>`:`<span class="bg-green-500 text-white px-2 py-1 rounded-full text- ml-2">✅ SYNC OK</span>`;document.getElementById('textAttentePro').innerText=total>0?`🔴 ${total} EN ATTENTE`:'✅ SYNC OK';document.getElementById('countDetail').innerText=total;document.getElementById('zoneAttente').classList.toggle('hidden',total==0);document.getElementById('listeAttente').innerHTML=cOff.map(c=>`<div class="bg-white p-2 rounded">💰 ${c.montant}F pour #${c.membre_id}</div>`).join('')+mOff.map(m=>`<div class="bg-white p-2 rounded">👤 ${m.nom}</div>`).join('')}
async function saveOffline(s,d){const tx=db.transaction(s,'readwrite');await tx.objectStore(s).add({...d,synced:false,timestamp:Date.now()});updateBadgeAttente()}
async function reveillerServeur(){document.getElementById('subServeur').innerText='⏳ Réveil du serveur... 30s';try{await fetch('/api/membres',{method:'GET'});document.getElementById('subServeur').innerText='✅ Serveur réveillé! Clique FORCER SYNC';alert('✅ Serveur réveillé! Maintenant clique FORCER SYNC')}catch(e){document.getElementById('subServeur').innerText='❌ Toujours endormi, réessaie dans 10s'}}
async function syncDonneesOffline(){if(!isOnline()||!db)return;try{const txM=db.transaction('membres_offline','readonly');const mOff=await new Promise(r=>{const q=txM.objectStore('membres_offline').getAll();q.onsuccess=()=>r(q.result)});for(const m of mOff){try{const fd=new FormData();fd.append('nom',m.nom);fd.append('telephone',m.telephone||'');fd.append('quartier',m.quartier||'');if(m.photoFile){const blob=await (await fetch(m.photoBase64)).blob();fd.append('photo',blob,'photo.jpg')}const res=await fetch('/api/membres',{method:'POST',body:fd});if(res.ok){const del=db.transaction('membres_offline','readwrite');del.objectStore('membres_offline').delete(m.tempId)}}catch(e){console.log('sync membre fail',e)}}const txC=db.transaction('cotisations_offline','readonly');const cOff=await new Promise(r=>{const q=txC.objectStore('cotisations_offline').getAll();q.onsuccess=()=>r(q.result)});for(const c of cOff){try{const res=await fetch('/api/cotisations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({membre_id:c.membre_id,montant:c.montant})});if(res.ok){const del=db.transaction('cotisations_offline','readwrite');del.objectStore('cotisations_offline').delete(c.tempId)}}catch(e){}}updateBadgeAttente();if(mOff.length>0||cOff.length>0){alert('✅ Sync réussi');chargerMembres();chargerCotisations()}}catch(e){console.log(e)}}
function openTab(n){document.querySelectorAll('#membres,#cotisations,#terrain').forEach(c=>c.classList.add('hidden'));document.getElementById(n).classList.remove('hidden')}
function fermerModal(id){document.getElementById(id).classList.add('hidden')}

// PHOTO OFFLINE LOGIC
document.getElementById('photo').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{tempPhotoBase64=ev.target.result;document.getElementById('previewForm').src=tempPhotoBase64;document.getElementById('previewForm').classList.remove('hidden')};reader.readAsDataURL(file)});
document.getElementById('edit_photo').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{tempEditPhotoBase64=ev.target.result;document.getElementById('previewEdit').src=tempEditPhotoBase64;document.getElementById('previewEdit').classList.remove('hidden')};reader.readAsDataURL(file)});

function ouvrirWhatsApp(tel,nom){if(!tel)return alert('Pas de WhatsApp');const num=tel.replace(/\s/g,'').replace('+','');window.open(`https://wa.me/${num}?text=${encodeURIComponent('Bonjour '+nom+' - ESPOIR CITOYEN 🇨🇮')}`,'_blank')}
async function voirCarte(id){const m=cacheMembresGlobal.find(x=>x.id==id);if(!m)return;document.getElementById('carteMembre').innerHTML=`${m.photoBase64?`<img src="${m.photoBase64}" class="carte-photo">`:m.photo?`<img src="/uploads/${m.photo}" class="carte-photo">`:''}<div class="carte-info"><h3 class="font-black text-[#002244]">ONG ESPOIR CITOYEN</h3><p><b>ID:</b> ${m.id}</p><p><b>Nom:</b> ${m.nom}</p><p><b>Tél:</b> ${m.telephone||''}</p><p><b>Quartier:</b> ${m.quartier||''}</p><p style="font-size:10px;margin-top:8px"><b>Depuis:</b> ${new Date(m.date_inscription||Date.now()).toLocaleDateString('fr-FR')}</p></div><div style="position:absolute;bottom:10px;left:15px;font-size:8px;opacity:0.6">V16.5 PHOTO OFFLINE</div>`;document.getElementById('modalCarte').classList.remove('hidden')}
function ouvrirModalEdit(m){document.getElementById('edit_id').value=m.id;document.getElementById('edit_nom').value=m.nom;document.getElementById('edit_telephone').value=m.telephone||'';document.getElementById('edit_quartier').value=m.quartier||'';tempEditPhotoBase64=m.photoBase64||'';const prev=document.getElementById('previewEdit');if(tempEditPhotoBase64){prev.src=tempEditPhotoBase64;prev.classList.remove('hidden')}else{prev.classList.add('hidden')}document.getElementById('modalEdit').classList.remove('hidden')}
function envoyerRecuWhatsApp(tel,nom,montant){if(!tel)return alert('Pas de numéro');const num=tel.replace(/\s/g,'').replace('+','');window.open(`https://wa.me/${num}?text=${encodeURIComponent('ESPOIR CITOYEN 🇨🇮\nBonjour '+nom+',\nReçu de '+montant.toLocaleString()+' FCFA confirmé.')}`,'_blank')}

async function chargerStatsLocal(){const totalM=cacheMembresGlobal.length;const totalC=cacheCotisGlobal.reduce((a,b)=>a+(b.montant||0),0);document.getElementById('totalMembres').textContent=totalM;document.getElementById('totalCotisations').textContent=totalC.toLocaleString()+' FCFA';const quartiers=[...new Set(cacheMembresGlobal.map(m=>m.quartier).filter(Boolean))];document.getElementById('totalQuartiers').textContent=quartiers.length;const ctx1=document.getElementById('chartQuartier');if(chartQuartier)chartQuartier.destroy();const qMap={};cacheMembresGlobal.forEach(m=>{qMap[m.quartier||'Autre']=(qMap[m.quartier||'Autre']||0)+1});chartQuartier=new Chart(ctx1,{type:'pie',data:{labels:Object.keys(qMap),datasets:[{data:Object.values(qMap),backgroundColor:['#002244','#059669','#F59E0B','#EF4444']}]}});const ctx2=document.getElementById('chartMois');if(chartMois)chartMois.destroy();const mMap={};cacheCotisGlobal.forEach(c=>{const mois=(c.date_cotisation||c.date||'').slice(0,7)||'2026-07';mMap[mois]=(mMap[mois]||0)+c.montant});chartMois=new Chart(ctx2,{type:'bar',data:{labels:Object.keys(mMap),datasets:[{label:'FCFA',data:Object.values(mMap),backgroundColor:'#002244'}]}})}
async function chargerMembres(s=''){try{const r=await fetch(`/api/membres?search=${encodeURIComponent(s)}`);if(r.ok){const d=await r.json();if(d.length>=0&&!s){const tx=db.transaction('cache_membres','readwrite');const st=tx.objectStore('cache_membres');await st.clear();d.forEach(m=>st.put({...m,photoBase64:m.photoBase64||''}));cacheMembresGlobal=await new Promise(res=>{const tx2=db.transaction('cache_membres','readonly');const q=tx2.objectStore('cache_membres').getAll();q.onsuccess=()=>res(q.result)});afficherMembres(s?d:cacheMembresGlobal);chargerStatsLocal();chargerSelectMembres();return}}}catch(e){}const tx=db.transaction('cache_membres','readonly');const q=tx.objectStore('cache_membres').getAll();q.onsuccess=()=>{let data=q.result;if(s)data=data.filter(m=>m.nom.toLowerCase().includes(s.toLowerCase()));cacheMembresGlobal=q.result;afficherMembres(data);chargerStatsLocal();chargerSelectMembres()}}
function afficherMembres(data){
  document.getElementById('listeMembres').innerHTML=data.map(m=>{
    const photoHtml = m.photoBase64? `<img src="${m.photoBase64}" class="photo-rond">` : m.photo? `<img src="/uploads/${m.photo}" class="photo-rond" onerror="this.outerHTML='<div class=\\'w-10 h-10 bg-gray-200 rounded-full flex items-center justify-center\\'>👤</div>'">` : `<div class="w-10 h-10 bg-gray-200 rounded-full flex items-center justify-center">👤</div>`;
    return `<tr class="border-b hover:bg-gray-50"><td class="p-3">${photoHtml}</td><td class="p-3 font-bold">${m.nom}</td><td class="p-3">${m.telephone||''}</td><td class="p-3">${m.quartier||''}</td><td class="p-3 text-xs">${new Date(m.date_inscription||Date.now()).toLocaleDateString('fr-FR')}</td><td class="p-3"><div class="flex gap-1 flex-wrap"><button onclick="voirCarte(${m.id})" class="bg-[#7C3AED] text-white px-2 py-1 rounded-full text-">💳</button><button onclick="ouvrirWhatsApp('${m.telephone||''}','${m.nom.replace(/'/g,"\\'")}')" class="bg-[#25D366] text-white px-2 py-1 rounded-full text-">💚</button><button onclick='ouvrirModalEdit(${JSON.stringify({...m,photoBase64:''}).replace(/'/g,"&apos;")})' class="bg-[#F59E0B] text-white px-2 py-1 rounded-full text-">✏️</button><button onclick="supprimerMembreLocal(${m.id})" class="bg-[#EF4444] text-white px-2 py-1 rounded-full text-">🗑</button></div></td></tr>`
  }).join('')||`<tr><td colspan=6 class="p-8 text-center text-gray-400">Aucun membre</td></tr>`;
}
async function chargerSelectMembres(){document.getElementById('membre_id').innerHTML='<option value="">-- Choisir --</option>'+cacheMembresGlobal.map(m=>`<option value="${m.id}">${m.nom}</option>`).join('')}
async function chargerCotisations(){try{const r=await fetch('/api/cotisations');if(r.ok){const d=await r.json();const tx=db.transaction('cache_cotisations','readwrite');const st=tx.objectStore('cache_cotisations');await st.clear();d.forEach(c=>st.put(c));cacheCotisGlobal=d;afficherCotisations(d);chargerStatsLocal();return}}catch(e){}const tx=db.transaction('cache_cotisations','readonly');const q=tx.objectStore('cache_cotisations').getAll();q.onsuccess=()=>{cacheCotisGlobal=q.result;afficherCotisations(q.result);chargerStatsLocal()}}
function afficherCotisations(data){document.getElementById('listeCotisations').innerHTML=data.map(c=>`<tr class="border-b"><td class="p-3">${c.nom||'Membre #'+c.membre_id}</td><td class="p-3">${c.quartier||''}</td><td class="p-3 font-bold">${(c.montant||0).toLocaleString()} F</td><td class="p-3 text-xs">${new Date(c.date_cotisation||c.date||Date.now()).toLocaleDateString()}</td><td class="p-3"><div class="flex gap-1"><button onclick="envoyerRecuWhatsApp('${c.telephone||''}','${c.nom||''}',${c.montant||0})" class="bg-[#25D366] text-white px-2 py-1 rounded-full text-">💚</button><button onclick="supprimerCotisationLocal(${c.id||c.tempId})" class="bg-red-400 text-white px-2 py-1 rounded-full text-">🗑</button></div></td></tr>`).join('')}
function rechercherMembres(){chargerMembres(document.getElementById('search').value)}
async function supprimerMembreLocal(id){if(!confirm('Supprimer?'))return;const tx=db.transaction('cache_membres','readwrite');tx.objectStore('cache_membres').delete(id);cacheMembresGlobal=cacheMembresGlobal.filter(m=>m.id!=id);afficherMembres(cacheMembresGlobal);chargerStatsLocal();chargerSelectMembres();try{await fetch(`/api/membres/${id}`,{method:'DELETE'})}catch(e){}}
async function supprimerCotisationLocal(id){if(!confirm('Supprimer?'))return;const tx=db.transaction('cache_cotisations','readwrite');tx.objectStore('cache_cotisations').delete(id);cacheCotisGlobal=cacheCotisGlobal.filter(c=>c.id!=id&&c.tempId!=id);afficherCotisations(cacheCotisGlobal);chargerStatsLocal()}
function viderCache(){if(confirm('Vider cache?')){indexedDB.deleteDatabase('espoir-citoyen-offline');location.reload()}}

document.getElementById('formMembre').addEventListener('submit',async e=>{
  e.preventDefault();
  const nom=document.getElementById('nom').value.trim();const telephone=document.getElementById('telephone').value;const quartier=document.getElementById('quartier').value;
  if(!nom)return alert('Nom obligatoire');
  const newM={id:Date.now(),nom,telephone,quartier,date_inscription:new Date().toISOString(),photoBase64:tempPhotoBase64||''};
  const tx=db.transaction('cache_membres','readwrite');tx.objectStore('cache_membres').put(newM);cacheMembresGlobal.push(newM);afficherMembres(cacheMembresGlobal);chargerStatsLocal();chargerSelectMembres();
  document.getElementById('previewForm').classList.add('hidden');tempPhotoBase64='';e.target.reset();
  if(!isOnline()){await saveOffline('membres_offline',{...newM,photoFile:!!newM.photoBase64});alert('📴 Membre + PHOTO sauvé OFFLINE')}
  else{try{const fd=new FormData();fd.append('nom',nom);fd.append('telephone',telephone);fd.append('quartier',quartier);const file=document.getElementById('photo').files[0];if(file)fd.append('photo',file);const res=await fetch('/api/membres',{method:'POST',body:fd});if(!res.ok)throw'err';alert('✅ Membre + photo envoyé')}catch(err){await saveOffline('membres_offline',{...newM,photoFile:!!newM.photoBase64});alert('⚠️ Serveur lent, sauvé en local avec photo')}}updateBadgeAttente()
});

document.getElementById('formEditMembre').addEventListener('submit',async e=>{
  e.preventDefault();const id=parseInt(document.getElementById('edit_id').value);const existing=cacheMembresGlobal.find(m=>m.id==id);const nom=document.getElementById('edit_nom').value;const telephone=document.getElementById('edit_telephone').value;const quartier=document.getElementById('edit_quartier').value;const updated={...existing,nom,telephone,quartier,photoBase64:tempEditPhotoBase64||existing.photoBase64||''};const tx=db.transaction('cache_membres','readwrite');tx.objectStore('cache_membres').put(updated);cacheMembresGlobal=cacheMembresGlobal.map(m=>m.id==id?updated:m);afficherMembres(cacheMembresGlobal);chargerSelectMembres();fermerModal('modalEdit');tempEditPhotoBase64='';try{const fd=new FormData();fd.append('nom',nom);fd.append('telephone',telephone);fd.append('quartier',quartier);const file=document.getElementById('edit_photo').files[0];if(file)fd.append('photo',file);await fetch(`/api/membres/${id}`,{method:'PUT',body:fd})}catch(err){}alert('✅ Modifié')
});

async function ajouterCotisation(){const membre_id=document.getElementById('membre_id').value;const montant=document.getElementById('montant').value;if(!membre_id||!montant)return alert('Choisis membre et montant');const membre=cacheMembresGlobal.find(m=>m.id==parseInt(membre_id));const data={id:Date.now(),tempId:Date.now(),membre_id:parseInt(membre_id),montant:parseInt(montant),nom:membre?.nom||'',quartier:membre?.quartier||'',telephone:membre?.telephone||'',date_cotisation:new Date().toISOString(),date:new Date().toISOString()};const tx=db.transaction('cache_cotisations','readwrite');tx.objectStore('cache_cotisations').put(data);cacheCotisGlobal.push(data);afficherCotisations(cacheCotisGlobal);chargerStatsLocal();document.getElementById('montant').value='';if(!isOnline()){await saveOffline('cotisations_offline',data);alert('📴 Cotisation OFFLINE')}else{try{await fetch('/api/cotisations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({membre_id:data.membre_id,montant:data.montant})})}catch(e){await saveOffline('cotisations_offline',data)}}updateBadgeAttente()}

(async()=>{await initDB();updateStatusReseau();await chargerMembres();await chargerCotisations();setInterval(updateBadgeAttente,2000)})();
</script>
