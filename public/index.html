<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESPOIR CITOYEN V16.4 COMPLET</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>.carte-membre{width:340px;height:214px;border:3px solid #002244;border-radius:12px;padding:15px;background:white;position:relative}.carte-logo{width:50px;position:absolute;top:10px;left:10px}.carte-photo{width:70px;height:70px;border-radius:50%;object-fit:cover;position:absolute;top:15px;right:15px;border:2px solid #002244}.carte-qr{width:60px;position:absolute;bottom:10px;right:10px}.carte-info{margin-top:40px;font-size:12px}</style>
</head>
<body class="bg-[#f1f5f9]">
<div class="bg-[#002244] text-white p-4 sticky top-0 z-50">
  <div class="flex justify-between items-center"><h1 class="font-black">🇨🇮 V16.4 BOSS COMPLET <span id="statusReseau" class="ml-2"></span><span id="badgeAttente"></span></h1><button onclick="location.reload()" class="bg-white/20 px-3 py-1 rounded-full text-xs">🔄</button></div>
  <div class="mt-4 grid grid-cols-2 lg:grid-cols-4 gap-3">
    <div class="bg-white/10 p-3 rounded-2xl"><p class="text- opacity-60">TOTAL MEMBRES</p><p id="totalMembres" class="text-xl font-black">0</p></div>
    <div class="bg-white/10 p-3 rounded-2xl"><p class="text- opacity-60">TOTAL COTISATIONS</p><p id="totalCotisations" class="text-xl font-black">0 FCFA</p></div>
    <div class="bg-white/10 p-3 rounded-2xl"><p class="text- opacity-60">QUARTIERS</p><p id="totalQuartiers" class="text-xl font-black">0</p></div>
    <div id="cardAttentePro" class="bg-green-500 p-3 rounded-2xl"><p id="textAttentePro" class="text-sm font-black">✅ SYNC OK</p></div>
  </div>
</div>

<div class="max-w- mx-auto p-4 space-y-4">
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-4"><div class="bg-white p-4 rounded-2xl shadow-sm"><canvas id="chartQuartier"></canvas></div><div class="bg-white p-4 rounded-2xl shadow-sm"><canvas id="chartMois"></canvas></div></div>
  <div class="flex gap-2"><button class="tab active px-5 py-3 rounded-xl bg-[#002244] text-white font-bold text-sm" onclick="openTab('membres')">👥 Membres</button><button class="tab px-5 py-3 rounded-xl bg-white font-bold text-sm" onclick="openTab('cotisations')">💰 Cotisations</button><button class="tab px-5 py-3 rounded-xl bg-[#FF9A00] text-white font-black text-sm" onclick="openTab('terrain')">⚡ TERRAIN</button></div>

  <div id="membres" class="content bg-white p-4 rounded-2xl shadow-sm">
    <form id="formMembre" class="flex gap-2 flex-wrap mb-4 bg-gray-50 p-3 rounded-xl"><input id="nom" placeholder="Nom complet *" required class="p-3 border-2 rounded-xl flex-1 font-bold"><input id="telephone" placeholder="WhatsApp" class="p-2 border rounded-lg"><input id="quartier" placeholder="Quartier" class="p-2 border rounded-lg"><input type="file" id="photo" accept="image/*" class="p-2"><button type="submit" class="bg-[#002244] text-white px-6 py-3 rounded-xl font-black">+ AJOUTER</button></form>
    <input id="search" placeholder="🔍 Rechercher..." onkeyup="rechercherMembres()" class="p-2 border rounded-lg w-full max-w-xs mb-3">
    <div class="overflow-auto"><table class="w-full text-sm"><thead><tr class="bg-[#002244] text-white"><th class="p-3 text-left">Photo</th><th class="p-3">Nom</th><th>Tél</th><th>Quartier</th><th>Date</th><th class="p-3 w-">Actions</th></tr></thead><tbody id="listeMembres"></tbody></table></div>
  </div>

  <div id="cotisations" class="content hidden bg-white p-4 rounded-2xl shadow-sm">
    <div class="flex gap-2 flex-wrap mb-4 bg-gray-50 p-3 rounded-xl"><select id="membre_id" class="p-3 border rounded-xl flex-1 font-bold"><option value="">-- Choisir --</option></select><input id="montant" type="number" placeholder="Montant" class="p-3 border-2 border-green-500 rounded-xl font-bold"><button onclick="ajouterCotisation()" class="bg-green-600 text-white px-6 py-3 rounded-xl font-black">💰 ENREGISTRER</button></div>
    <div class="overflow-auto"><table class="w-full text-sm"><thead><tr class="bg-[#002244] text-white"><th class="p-3">Membre</th><th>Quartier</th><th>Montant</th><th>Date</th><th class="p-3">Actions</th></tr></thead><tbody id="listeCotisations"></tbody></table></div>
  </div>

  <div id="terrain" class="content hidden bg-white p-4 rounded-2xl shadow-sm border-2 border-orange-400"><div class="flex gap-2 mb-4"><input id="searchTerrain" placeholder="Chercher..." onkeyup="filtrerTerrain()" class="p-2 border rounded-lg flex-1"><select id="montantTerrain" class="p-2 border-2 border-orange-400 rounded-lg font-bold"><option value="1000">1000F</option><option value="2000" selected>2000F</option><option value="5000">5000F</option></select></div><div id="listeTerrain" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div></div>
  <div id="zoneAttente" class="hidden bg-red-50 border-2 border-dashed border-red-300 rounded-2xl p-4"><h3 class="font-black text-red-600">⏳ EN ATTENTE: <span id="countDetail">0</span> <button onclick="syncDonneesOffline()" class="ml-3 bg-red-600 text-white px-3 py-1 rounded-full text-xs">FORCER SYNC</button></h3><div id="listeAttente" class="mt-3 space-y-2"></div></div>
</div>

<!-- MODAL EDIT -->
<div id="modalEdit" class="hidden fixed inset-0 bg-black/60 z-[100] p-4 flex items-center justify-center"><div class="bg-white w-full max-w-md p-6 rounded-2xl"><h3 class="font-black mb-3">✏️ Modifier membre</h3><form id="formEditMembre"><input type="hidden" id="edit_id"><input id="edit_nom" placeholder="Nom" class="w-full p-3 border rounded-xl mb-2 font-bold"><input id="edit_telephone" placeholder="Tél" class="w-full p-2 border rounded-lg mb-2"><input id="edit_quartier" placeholder="Quartier" class="w-full p-2 border rounded-lg mb-2"><input type="file" id="edit_photo" class="w-full mb-3"><div class="flex gap-2"><button type="submit" class="flex-1 bg-[#002244] text-white py-3 rounded-xl font-black">Enregistrer</button><button type="button" onclick="fermerModal('modalEdit')" class="flex-1 bg-gray-300 py-3 rounded-xl">Annuler</button></div></form></div></div>
<!-- MODAL CARTE -->
<div id="modalCarte" class="hidden fixed inset-0 bg-black/60 z-[100] p-4 flex items-center justify-center"><div class="bg-white p-6 rounded-2xl text-center"><h3 class="font-black mb-3">💳 Carte Membre</h3><div id="carteMembre" class="carte-membre mx-auto text-left"></div><div class="flex gap-2 mt-4"><button onclick="window.print()" class="flex-1 bg-blue-600 text-white py-2 rounded-xl">🖨 Imprimer</button><button onclick="fermerModal('modalCarte')" class="flex-1 bg-gray-400 text-white py-2 rounded-xl">Fermer</button></div></div></div>

<script>
let chartQuartier=null, chartMois=null, db, cacheMembresGlobal=[], cacheCotisGlobal=[];
const initDB=()=>new Promise((res)=>{const r=indexedDB.open('espoir-citoyen-offline',3);r.onupgradeneeded=e=>{db=e.target.result;if(!db.objectStoreNames.contains('membres_offline'))db.createObjectStore('membres_offline',{keyPath:'tempId',autoIncrement:true});if(!db.objectStoreNames.contains('cotisations_offline'))db.createObjectStore('cotisations_offline',{keyPath:'tempId',autoIncrement:true});if(!db.objectStoreNames.contains('cache_membres'))db.createObjectStore('cache_membres',{keyPath:'id'});if(!db.objectStoreNames.contains('cache_cotisations'))db.createObjectStore('cache_cotisations',{keyPath:'id'})};r.onsuccess=e=>{db=e.target.result;res(db)}});
function isOnline(){return navigator.onLine}function updateStatusReseau(){document.getElementById('statusReseau').innerHTML=isOnline()?'<span class="bg-green-400 text-green-900 px-2 py-1 rounded-full text- font-black">🟢 EN LIGNE</span>':'<span class="bg-red-400 text-white px-2 py-1 rounded-full text-">🔴 OFFLINE</span>';updateBadgeAttente()}window.addEventListener('online',()=>{updateStatusReseau();syncDonneesOffline()});window.addEventListener('offline',updateStatusReseau);
async function updateBadgeAttente(){if(!db)return;const txM=db.transaction('membres_offline','readonly');const mOff=await new Promise(r=>{const q=txM.objectStore('membres_offline').getAll();q.onsuccess=()=>r(q.result)});const txC=db.transaction('cotisations_offline','readonly');const cOff=await new Promise(r=>{const q=txC.objectStore('cotisations_offline').getAll();q.onsuccess=()=>r(q.result)});const total=mOff.length+cOff.length;document.getElementById('badgeAttente').innerHTML=total>0?`<span class="bg-red-600 text-white px-2 py-1 rounded-full text- font-black ml-2">🔴 ${total} EN ATTENTE</span>`:`<span class="bg-green-500 text-white px-2 py-1 rounded-full text- ml-2">✅ SYNC OK</span>`;document.getElementById('textAttentePro').innerText=total>0?`🔴 ${total} EN ATTENTE`:'✅ SYNC OK';document.getElementById('countDetail').innerText=total;document.getElementById('zoneAttente').classList.toggle('hidden',total==0);document.getElementById('listeAttente').innerHTML=cOff.map(c=>`<div class="bg-white p-2 rounded text-xs">💰 ${c.montant}F pour #${c.membre_id}</div>`).join('')+mOff.map(m=>`<div class="bg-white p-2 rounded text-xs">👤 ${m.nom}</div>`).join('')}
async function saveOffline(s,d){const tx=db.transaction(s,'readwrite');await tx.objectStore(s).add({...d,synced:false,timestamp:Date.now()});updateBadgeAttente()}
async function syncDonneesOffline(){if(!isOnline()||!db)return;const txM=db.transaction('membres_offline','readonly');const mOff=await new Promise(r=>{const q=txM.objectStore('membres_offline').getAll();q.onsuccess=()=>r(q.result)});for(const m of mOff){try{const fd=new FormData();fd.append('nom',m.nom);fd.append('telephone',m.telephone||'');fd.append('quartier',m.quartier||'');const res=await fetch('/api/membres',{method:'POST',body:fd});if(res.ok){const del=db.transaction('membres_offline','readwrite');del.objectStore('membres_offline').delete(m.tempId)}}catch(e){}}const txC=db.transaction('cotisations_offline','readonly');const cOff=await new Promise(r=>{const q=txC.objectStore('cotisations_offline').getAll();q.onsuccess=()=>r(q.result)});for(const c of cOff){try{const res=await fetch('/api/cotisations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({membre_id:c.membre_id,montant:c.montant})});if(res.ok){const del=db.transaction('cotisations_offline','readwrite');del.objectStore('cotisations_offline').delete(c.tempId)}}catch(e){}}updateBadgeAttente();if(mOff.length>0||cOff.length>0){alert('✅ Sync OK');chargerMembres();chargerCotisations()}}
function openTab(n){document.querySelectorAll('.content').forEach(c=>c.classList.add('hidden'));document.getElementById(n).classList.remove('hidden')}
function fermerModal(id){document.getElementById(id).classList.add('hidden')}

// ==== ACTIONS BOSS RESTAURÉES ====
function ouvrirWhatsApp(tel,nom){if(!tel)return alert('Pas de numéro WhatsApp');const num=tel.replace(/\s/g,'').replace('+','');const msg=encodeURIComponent(`Bonjour ${nom}, message de ESPOIR CITOYEN 🇨🇮`);window.open(`https://wa.me/${num}?text=${msg}`,'_blank')}
async function voirCarte(id){const m=cacheMembresGlobal.find(x=>x.id==id);if(!m)return alert('Membre introuvable');let qrcode='';try{if(isOnline()){const r=await fetch(`/api/membre/${id}/carte`);if(r.ok){const d=await r.json();qrcode=d.qrcode||''}}}catch(e){}document.getElementById('carteMembre').innerHTML=`<img src="/logo.png" class="carte-logo" onerror="this.style.display='none'">${m.photo?`<img src="/uploads/${m.photo}" class="carte-photo" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(m.nom)}'">`:''}<div class="carte-info"><h3 class="font-black text-[#002244]">ONG ESPOIR CITOYEN</h3><p><b>ID:</b> ${m.id}</p><p><b>Nom:</b> ${m.nom}</p><p><b>Tél:</b> ${m.telephone||''}</p><p><b>Quartier:</b> ${m.quartier||''}</p><p style="font-size:10px;margin-top:8px"><b>Depuis:</b> ${new Date(m.date_inscription||Date.now()).toLocaleDateString('fr-FR')}</p></div>${qrcode?`<img src="${qrcode}" class="carte-qr">`:''}`;document.getElementById('modalCarte').classList.remove('hidden')}
function ouvrirModalEdit(m){document.getElementById('edit_id').value=m.id;document.getElementById('edit_nom').value=m.nom;document.getElementById('edit_telephone').value=m.telephone||'';document.getElementById('edit_quartier').value=m.quartier||'';document.getElementById('modalEdit').classList.remove('hidden')}
function envoyerRecuWhatsApp(tel,nom,montant){if(!tel)return alert('Pas de numéro');const num=tel.replace(/\s/g,'').replace('+','');const msg=encodeURIComponent(`ESPOIR CITOYEN 🇨🇮\nBonjour ${nom},\nReçu de ${montant.toLocaleString()} FCFA confirmé.\nMerci!`);window.open(`https://wa.me/${num}?text=${msg}`,'_blank')}

async function chargerStatsLocal(){const totalM=cacheMembresGlobal.length;const totalC=cacheCotisGlobal.reduce((a,b)=>a+(b.montant||0),0);document.getElementById('totalMembres').textContent=totalM;document.getElementById('totalCotisations').textContent=totalC.toLocaleString()+' FCFA';const quartiers=[...new Set(cacheMembresGlobal.map(m=>m.quartier).filter(Boolean))];document.getElementById('totalQuartiers').textContent=quartiers.length;const ctx1=document.getElementById('chartQuartier');if(chartQuartier)chartQuartier.destroy();const qMap={};cacheMembresGlobal.forEach(m=>{qMap[m.quartier||'Autre']=(qMap[m.quartier||'Autre']||0)+1});chartQuartier=new Chart(ctx1,{type:'pie',data:{labels:Object.keys(qMap),datasets:[{data:Object.values(qMap),backgroundColor:['#002244','#059669','#F59E0B','#EF4444']}]}});const ctx2=document.getElementById('chartMois');if(chartMois)chartMois.destroy();const mMap={};cacheCotisGlobal.forEach(c=>{const mois=(c.date_cotisation||c.date||'').slice(0,7)||'2026-07';mMap[mois]=(mMap[mois]||0)+c.montant});chartMois=new Chart(ctx2,{type:'bar',data:{labels:Object.keys(mMap),datasets:[{label:'FCFA',data:Object.values(mMap),backgroundColor:'#002244'}]}})}
async function chargerMembres(s=''){try{const r=await fetch(`/api/membres?search=${encodeURIComponent(s)}`);if(r.ok){const d=await r.json();if(d.length>=0){const tx=db.transaction('cache_membres','readwrite');const st=tx.objectStore('cache_membres');if(!s){await st.clear();d.forEach(m=>st.put(m))}cacheMembresGlobal=s?d:await new Promise(res=>{const tx2=db.transaction('cache_membres','readonly');const q=tx2.objectStore('cache_membres').getAll();q.onsuccess=()=>res(q.result)});if(s)cacheMembresGlobal=d;if(!s||d.length>0){afficherMembres(d);chargerStatsLocal();chargerSelectMembres();return}}}}catch(e){}const tx=db.transaction('cache_membres','readonly');const q=tx.objectStore('cache_membres').getAll();q.onsuccess=()=>{let data=q.result;if(s)data=data.filter(m=>m.nom.toLowerCase().includes(s.toLowerCase()));cacheMembresGlobal=q.result;afficherMembres(data);chargerStatsLocal();chargerSelectMembres()}}
function afficherMembres(data){
  document.getElementById('listeMembres').innerHTML=data.map(m=>`
    <tr class="border-b hover:bg-gray-50">
      <td class="p-3">${m.photo?`<img src="/uploads/${m.photo}" class="w-8 h-8 rounded-full object-cover">`:`<div class="w-8 h-8 bg-gray-200 rounded-full flex items-center justify-center">👤</div>`}</td>
      <td class="p-3 font-bold">${m.nom}</td><td class="p-3">${m.telephone||''}</td><td class="p-3">${m.quartier||''}</td><td class="p-3 text-xs">${new Date(m.date_inscription||Date.now()).toLocaleDateString('fr-FR')}</td>
      <td class="p-3">
        <div class="flex gap-1 flex-wrap">
          <button onclick="voirCarte(${m.id})" class="bg-[#7C3AED] text-white px-2 py-1 rounded-full text- font-bold" title="Carte">💳</button>
          <button onclick="ouvrirWhatsApp('${m.telephone||''}','${m.nom.replace(/'/g,"\\'")}')" class="bg-[#25D366] text-white px-2 py-1 rounded-full text- font-bold" title="WhatsApp">💚</button>
          <button onclick='ouvrirModalEdit(${JSON.stringify(m).replace(/'/g,"&apos;")})' class="bg-[#F59E0B] text-white px-2 py-1 rounded-full text- font-bold" title="Modifier">✏️</button>
          <button onclick="supprimerMembreLocal(${m.id})" class="bg-[#EF4444] text-white px-2 py-1 rounded-full text-" title="Supprimer">🗑</button>
        </div>
      </td>
    </tr>`).join('')||`<tr><td colspan=6 class="p-8 text-center text-gray-400">Aucun membre</td></tr>`;
  afficherTerrain(data);
}
async function chargerSelectMembres(){const sel=document.getElementById('membre_id');sel.innerHTML='<option value="">-- Choisir --</option>'+cacheMembresGlobal.map(m=>`<option value="${m.id}">${m.nom}</option>`).join('')}
async function chargerCotisations(){try{const r=await fetch('/api/cotisations');if(r.ok){const d=await r.json();const tx=db.transaction('cache_cotisations','readwrite');const st=tx.objectStore('cache_cotisations');await st.clear();d.forEach(c=>st.put(c));cacheCotisGlobal=d;afficherCotisations(d);chargerStatsLocal();return}}catch(e){}const tx=db.transaction('cache_cotisations','readonly');const q=tx.objectStore('cache_cotisations').getAll();q.onsuccess=()=>{cacheCotisGlobal=q.result;afficherCotisations(q.result);chargerStatsLocal()}}
function afficherCotisations(data){document.getElementById('listeCotisations').innerHTML=data.map(c=>`<tr class="border-b"><td class="p-3">${c.nom||'Membre #'+c.membre_id}</td><td class="p-3">${c.quartier||''}</td><td class="p-3 font-bold">${(c.montant||0).toLocaleString()} F</td><td class="p-3 text-xs">${new Date(c.date_cotisation||c.date||Date.now()).toLocaleDateString()}</td><td class="p-3"><div class="flex gap-1"><button onclick="envoyerRecuWhatsApp('${c.telephone||''}','${c.nom||''}',${c.montant||0})" class="bg-[#25D366] text-white px-2 py-1 rounded-full text-">💚 Reçu</button><button onclick="supprimerCotisationLocal(${c.id||c.tempId})" class="bg-red-400 text-white px-2 py-1 rounded-full text-">🗑</button></div></td></tr>`).join('')||`<tr><td colspan=5 class="p-8 text-center text-gray-400">Aucune cotisation</td></tr>`}
function afficherTerrain(data){document.getElementById('listeTerrain').innerHTML=data.map(m=>`<div class="border p-3 rounded-xl flex justify-between items-center"><div><b class="text-sm">${m.nom}</b><br><small>${m.quartier||''}</small></div><button onclick="encaisserTerrain(${m.id})" class="bg-green-600 text-white px-4 py-2 rounded-full font-black">💰</button></div>`).join('')}
function filtrerTerrain(){const q=document.getElementById('searchTerrain').value.toLowerCase();afficherTerrain(cacheMembresGlobal.filter(m=>m.nom.toLowerCase().includes(q)))}
async function encaisserTerrain(id){const montant=parseInt(document.getElementById('montantTerrain').value);const membre=cacheMembresGlobal.find(m=>m.id==id);const data={id:Date.now(),tempId:Date.now(),membre_id:id,montant,nom:membre?.nom||'',quartier:membre?.quartier||'',telephone:membre?.telephone||'',date_cotisation:new Date().toISOString(),date:new Date().toISOString()};const tx=db.transaction('cache_cotisations','readwrite');tx.objectStore('cache_cotisations').put(data);cacheCotisGlobal.push(data);if(!isOnline())await saveOffline('cotisations_offline',data);else{try{await fetch('/api/cotisations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({membre_id:id,montant})})}catch(e){await saveOffline('cotisations_offline',data)}}afficherCotisations(cacheCotisGlobal);chargerStatsLocal();updateBadgeAttente();alert('✅ '+montant+'F encaissé')}
document.getElementById('formMembre').addEventListener('submit',async e=>{e.preventDefault();const nom=document.getElementById('nom').value.trim();const telephone=document.getElementById('telephone').value;const quartier=document.getElementById('quartier').value;if(!nom)return alert('Nom obligatoire');const newM={id:Date.now(),nom,telephone,quartier,date_inscription:new Date().toISOString()};const tx=db.transaction('cache_membres','readwrite');tx.objectStore('cache_membres').put(newM);cacheMembresGlobal.push(newM);afficherMembres(cacheMembresGlobal);chargerStatsLocal();chargerSelectMembres();e.target.reset();if(!isOnline()){await saveOffline('membres_offline',newM);alert('📴 Membre sauvé OFFLINE')}else{try{const fd=new FormData();fd.append('nom',nom);fd.append('telephone',telephone);fd.append('quartier',quartier);const file=document.getElementById('photo').files[0];if(file)fd.append('photo',file);const res=await fetch('/api/membres',{method:'POST',body:fd});if(!res.ok)throw'err';alert('✅ Membre ajouté')}catch(err){await saveOffline('membres_offline',newM);alert('⚠️ Sauvé en local, sync plus tard')}}updateBadgeAttente()});
document.getElementById('formEditMembre').addEventListener('submit',async e=>{e.preventDefault();const id=parseInt(document.getElementById('edit_id').value);const nom=document.getElementById('edit_nom').value;const telephone=document.getElementById('edit_telephone').value;const quartier=document.getElementById('edit_quartier').value;const updated={...cacheMembresGlobal.find(m=>m.id==id),nom,telephone,quartier};const tx=db.transaction('cache_membres','readwrite');tx.objectStore('cache_membres').put(updated);cacheMembresGlobal=cacheMembresGlobal.map(m=>m.id==id?updated:m);afficherMembres(cacheMembresGlobal);chargerSelectMembres();fermerModal('modalEdit');try{const fd=new FormData();fd.append('nom',nom);fd.append('telephone',telephone);fd.append('quartier',quartier);const file=document.getElementById('edit_photo').files[0];if(file)fd.append('photo',file);await fetch(`/api/membres/${id}`,{method:'PUT',body:fd})}catch(err){}alert('✅ Modifié')});
async function ajouterCotisation(){const membre_id=document.getElementById('membre_id').value;const montant=document.getElementById('montant').value;if(!membre_id||!montant)return alert('Choisis membre et montant');const membre=cacheMembresGlobal.find(m=>m.id==parseInt(membre_id));const data={id:Date.now(),tempId:Date.now(),membre_id:parseInt(membre_id),montant:parseInt(montant),nom:membre?.nom||'',quartier:membre?.quartier||'',telephone:membre?.telephone||'',date_cotisation:new Date().toISOString(),date:new Date().toISOString()};const tx=db.transaction('cache_cotisations','readwrite');tx.objectStore('cache_cotisations').put(data);cacheCotisGlobal.push(data);afficherCotisations(cacheCotisGlobal);chargerStatsLocal();document.getElementById('montant').value='';if(!isOnline()){await saveOffline('cotisations_offline',data);alert('📴 Cotisation OFFLINE')}else{try{await fetch('/api/cotisations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({membre_id:data.membre_id,montant:data.montant})})}catch(e){await saveOffline('cotisations_offline',data)}}updateBadgeAttente()}
function rechercherMembres(){chargerMembres(document.getElementById('search').value)}
async function supprimerMembreLocal(id){if(!confirm('Supprimer?'))return;const tx=db.transaction('cache_membres','readwrite');tx.objectStore('cache_membres').delete(id);cacheMembresGlobal=cacheMembresGlobal.filter(m=>m.id!=id);afficherMembres(cacheMembresGlobal);chargerStatsLocal();chargerSelectMembres();try{await fetch(`/api/membres/${id}`,{method:'DELETE'})}catch(e){}}
async function supprimerCotisationLocal(id){if(!confirm('Supprimer?'))return;const tx=db.transaction('cache_cotisations','readwrite');tx.objectStore('cache_cotisations').delete(id);cacheCotisGlobal=cacheCotisGlobal.filter(c=>c.id!=id&&c.tempId!=id);afficherCotisations(cacheCotisGlobal);chargerStatsLocal();try{await fetch(`/api/cotisations/${id}`,{method:'DELETE'})}catch(e){}}
(async()=>{await initDB();updateStatusReseau();await chargerMembres();await chargerCotisations();setInterval(updateBadgeAttente,2000)})();
</script>
