<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESPOIR CITOYEN V14</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background: #f5f5f5; }
    h1 { color: #003366; text-align: center; margin-bottom: 20px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #003366; }
    .tab { padding: 10px 20px; cursor: pointer; background: #eee; border: none; font-size: 16px; }
    .tab.active { background: #003366; color: white; }
    .content { display: none; }
    .content.active { display: block; }
    input, select, button { padding: 10px; margin: 5px; font-size: 16px; width: 100%; max-width: 300px; }
    button { background: #003366; color: white; border: none; cursor: pointer; border-radius: 4px; }
    .btn-export { background: #059669; margin-bottom: 15px; width: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    td, th { border: 1px solid #ddd; padding: 12px; text-align: left; }
    th { background: #003366; color: white; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
    .stat-box { background: #003366; color: white; padding: 30px; border-radius: 8px; text-align: center; }
    .form-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
  </style>
</head>
<body>
  <h1>🇨🇮 ESPOIR CITOYEN V14</h1>

  <div class="tabs">
    <button class="tab active" onclick="openTab('membres')">Membres</button>
    <button class="tab" onclick="openTab('cotisations')">Cotisations</button>
  </div>

  <!-- ONGLET MEMBRES -->
  <div id="membres" class="content active">
    <h2>Ajouter un membre</h2>
    <div class="form-row">
      <input id="nom" placeholder="Nom complet">
      <input id="telephone" placeholder="Téléphone">
      <input id="quartier" placeholder="Quartier">
      <button onclick="ajouterMembre()">Ajouter</button>
    </div>

    <button class="btn-export" onclick="exporterMembres()">📊 Exporter Excel</button>

    <h3>Liste des membres</h3>
    <table id="tableMembres">
      <thead>
        <tr>
          <th>Nom</th>
          <th>Téléphone</th>
          <th>Quartier</th>
          <th>Date</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- ONGLET COTISATIONS -->
  <div id="cotisations" class="content">
    <h2>Ajouter une cotisation</h2>
    <div class="form-row">
      <select id="membre_id"></select>
      <input id="montant" type="number" placeholder="Montant FCFA">
      <button onclick="ajouterCotisation()">Enregistrer</button>
    </div>
    <h3>Liste des cotisations</h3>
    <table id="tableCotisations">
      <thead>
        <tr>
          <th>Membre</th>
          <th>Montant</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    // GESTION DES ONGLETS
    function openTab(tabName) {
      document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById(tabName).classList.add('active');
      event.target.classList.add('active');
    }
